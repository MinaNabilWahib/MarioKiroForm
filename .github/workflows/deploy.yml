name: Deploy branch to Vercel

on:
  push:
    branches:
      - 1oak-studios
      - mariokero

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ github.ref_name == '1oak-studios' && 'prj_A8FBRVIDLFwNWnTpXu9Q4YLdPHaX' || 'prj_QUxX1Xshd52eqwaBnC5sKelZpfbi' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel --token="$VERCEL_TOKEN" --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}